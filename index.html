<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PTT Archives Helper</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            flex-basis: 360px;
            flex-shrink: 0;
            padding: 20px;
            background-color: #f4f4f4;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            text-align: center;
            transition: all 0.3s ease;
        }

        .left-panel-content {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        .mobile-toggle-btn {
            display: none;
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            background-color: #eaeaea;
        }

        .right-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .form-group-annuaire {
            margin-top: 25px;
        }

        .form-group-inline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .form-group-inline label {
            margin-bottom: 0;
            white-space: nowrap;
            font-weight: bold;
        }

        .form-group-inline input,
        .form-group-inline select {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .slider-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 12px;
        }

        .button-group button,
        .external-link button {
            padding: 8px 12px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .button-group button:hover,
        .external-link button:hover {
            background-color: #0056b3;
        }

        .info-badge {
            background-color: #e7f3fe;
            border-left: 4px solid #2196F3;
            padding: 8px;
            font-size: 0.85em;
            color: #0c5460;
            margin-bottom: 12px;
            border-radius: 2px;
            display: none;
            text-align: center;
        }

        .info-badge.warning {
            background-color: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }

        .favoris-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #ccc;
            text-align: left;
        }

        .favoris-section details {
            background: #fff;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .favoris-section summary {
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .fav-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 8px;
            border-radius: 4px;
            margin-top: 8px;
            font-size: 0.85em;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .fav-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #007BFF;
        }

        .fav-note {
            color: #555;
            font-style: italic;
            word-break: break-word;
        }

        .fav-actions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .fav-actions button {
            padding: 3px 6px;
            font-size: 0.8em;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }

        .btn-load { background: #28a745; color: white; }
        .btn-delete { background: #dc3545; color: white; }

        .external-link {
            padding-top: 15px;
            text-align: center;
        }

        .external-link button {
            width: 100%;
            padding: 10px;
        }

        .url-display {
            width: 100%;
            padding: 8px;
            background-color: #ffffff;
            font-family: monospace;
            word-break: break-all;
            text-align: center;
            border-bottom: 1px solid #ccc;
            font-size: 0.9em;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.85em;
            display: none;
            margin-top: 4px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                flex-basis: auto;
                width: 100%;
                max-height: 50vh;
                padding: 12px;
                box-shadow: none;
                border-bottom: 2px solid #ccc;
            }
            .left-panel-content {
                margin: 0;
            }
            .form-group-annuaire {
                margin-top: 10px;
            }
            .mobile-toggle-btn {
                display: block;
            }
            .left-panel.collapsed {
                max-height: none;
                padding: 8px 12px;
            }
            .left-panel.collapsed .left-panel-content,
            .left-panel.collapsed .favoris-section,
            .left-panel.collapsed .external-link {
                display: none;
            }
            .left-panel.collapsed .mobile-toggle-btn {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <button id="mobileToggleBtn" class="mobile-toggle-btn">⚙️ Masquer les filtres</button>

            <div class="left-panel-content">
                <!-- a) Sélection de la Région / Canton -->
                <div class="form-group-inline">
                    <label for="regionSelect">Région :</label>
                    <select id="regionSelect">
                        <option value="">Sélectionnez une région</option>
                    </select>
                </div>

                <!-- b) Sélection de l'année -->
                <div class="form-group-inline">
                    <label for="year">Année :</label>
                    <input type="number" id="year" value="1920" min="1880" max="1950">
                    <small id="yearError" class="error-message">L'année doit être comprise entre 1880 et 1950.</small>
                </div>

                <div class="button-group">
                    <button id="btnYearDec10">- 10</button>
                    <button id="btnYearDec1">- 1</button>
                    <button id="btnYearInc1">+ 1</button>
                    <button id="btnYearInc10">+ 10</button>
                </div>

                <!-- c) Sélecteur d'édition dynamique -->
                <div class="form-group-inline" id="editionGroup" style="display: none;">
                    <label for="editionSelect">Édition :</label>
                    <select id="editionSelect"></select>
                </div>

                <!-- d) Champ d'information (Badge explicatif) -->
                <div id="ruleNote" class="info-badge"></div>

                <!-- e) Sélection de la page & Slider de saut rapide -->
                <div class="form-group-inline">
                    <label for="page">Page :</label>
                    <input type="number" id="page" value="1" min="1" max="9999">
                    <small id="pageError" class="error-message">La page doit être comprise entre 1 et 9999.</small>
                </div>

                <div class="slider-container">
                    <span style="font-size: 0.8em; font-weight: bold;">1</span>
                    <input type="range" id="pageSlider" min="1" max="1700" value="1">
                    <span id="sliderMaxLabel" style="font-size: 0.8em; font-weight: bold;">1700</span>
                </div>

                <div class="button-group">
                    <button id="btnPageDec100">-100</button>
                    <button id="btnPageDec10">-10</button>
                    <button id="btnPageDec1">-1</button>
                    <button id="btnPageInc1">+1</button>
                    <button id="btnPageInc10">+10</button>
                    <button id="btnPageInc100">+100</button>
                </div>

                <!-- f) Bouton Actualiser -->
                <div class="button-group">
                    <button id="btnRefresh" style="width: 100%; background-color: #28a745;">Actualiser</button>
                </div>

                <!-- g) Groupe d'annuaire (Code et Extension) -->
                <div class="form-group form-group-annuaire">
                    <label for="annuaireText">Annuaire :</label>
                    <input type="text" id="annuaireText" placeholder="Code d'annuaire (auto ou manuel)">
                    <input type="text" id="annuaireExtension" placeholder="Extension optionnelle (ex: _a)" style="margin-top: 6px;">
                </div>
            </div>

            <!-- Block Favoris & Notes -->
            <div class="favoris-section">
                <details>
                    <summary>⭐ Favoris & Carnet (<span id="favCount">0</span>)</summary>
                    <div style="margin-top: 10px;">
                        <input type="text" id="favNoteInput" placeholder="Note (ex: Famille Dupuis)" style="width:100%; padding:6px; border:1px solid #ccc; border-radius:4px; margin-bottom:6px;">
                        <button id="btnAddFav" style="width:100%; padding:6px; background:#17a2b8; color:white; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">⭐ Ajouter cette page</button>
                        
                        <div id="favList" style="max-height: 180px; overflow-y: auto; margin-top: 8px;"></div>

                        <div class="button-group" style="margin-top:10px; margin-bottom: 0;">
                            <button id="btnExportCSV" style="background-color:#6c757d; font-size:0.75em; padding:4px 6px;">📥 CSV</button>
                            <button id="btnExportJSON" style="background-color:#6c757d; font-size:0.75em; padding:4px 6px;">📥 JSON</button>
                            <button id="btnExportHTML" style="background-color:#28a745; font-size:0.75em; padding:4px 6px;">🌐 HTML</button>
                            <button id="btnImportJSON" style="background-color:#17a2b8; font-size:0.75em; padding:4px 6px;">📤 Importer</button>
                            <button id="btnClearFavs" style="background-color:#dc3545; font-size:0.75em; padding:4px 6px;">🗑️ Effacer</button>
                            <input type="file" id="importFileInput" accept=".json" style="display: none;">
                        </div>
                    </div>
                </details>
            </div>

            <div class="external-link">
                <button id="btnHistoricSearch">Ouvrir Historic Search</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="urlDisplay" class="url-display">
                <a id="urlLink" href="#" target="_blank" rel="noopener noreferrer">L'URL s'affichera ici</a>
            </div>
            <iframe id="resultFrame" title="Aperçu du document IIIF" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. LOGIQUE D'INTERFACE ET ARCHIVES
        // =========================================================================

        document.addEventListener('DOMContentLoaded', () => {
            const yearInput = document.getElementById('year');
            const yearError = document.getElementById('yearError');
            const regionSelect = document.getElementById('regionSelect');
            const editionGroup = document.getElementById('editionGroup');
            const editionSelect = document.getElementById('editionSelect');
            const annuaireText = document.getElementById('annuaireText');
            const annuaireExtensionInput = document.getElementById('annuaireExtension');
            const ruleNote = document.getElementById('ruleNote');
            const pageInput = document.getElementById('page');
            const pageSlider = document.getElementById('pageSlider');
            const sliderMaxLabel = document.getElementById('sliderMaxLabel');
            const pageError = document.getElementById('pageError');
            const iframe = document.getElementById('resultFrame');
            const urlLink = document.getElementById('urlLink');
            const mobileToggleBtn = document.getElementById('mobileToggleBtn');
            const leftPanel = document.querySelector('.left-panel');

            // Mémorisation de la session d'annuaire en cours
            let currentAnnuaireKey = '';
            let currentAnnuaireMax = 600;

            // Détection 404 : ajustement automatique du max du slider à (failedPage - 1)
            window.handlePageNotFound = (failedPage) => {
                if (failedPage > 1) {
                    const newMax = failedPage - 1;
                    currentAnnuaireMax = newMax;
                    pageSlider.max = newMax;
                    sliderMaxLabel.textContent = newMax;
                }
            };

            // Exposer les fonctions de changement global
            window.changeYear = (delta) => {
                let currentYear = parseInt(yearInput.value, 10) || 1920;
                let newYear = Math.min(Math.max(currentYear + delta, 1880), 1950);
                if (newYear !== currentYear) {
                    yearInput.value = newYear;
                    updateIframe();
                    if (iframe.contentWindow && typeof iframe.contentWindow.showYearToast === 'function') {
                        iframe.contentWindow.showYearToast(newYear);
                    }
                }
            };

            window.changePage = (delta) => {
                let currentPage = parseInt(pageInput.value, 10) || 1;
                pageInput.value = Math.min(Math.max(currentPage + delta, 1), 9999);
                updateIframe();
            };

            // Favoris & Storage
            const favNoteInput = document.getElementById('favNoteInput');
            const btnAddFav = document.getElementById('btnAddFav');
            const favList = document.getElementById('favList');
            const favCount = document.getElementById('favCount');
            const importFileInput = document.getElementById('importFileInput');
            let favorites = JSON.parse(localStorage.getItem('ptt_favorites') || '[]');

            mobileToggleBtn.addEventListener('click', () => {
                leftPanel.classList.toggle('collapsed');
                mobileToggleBtn.textContent = leftPanel.classList.contains('collapsed') ? '⚙️ Afficher les filtres' : '⚙️ Masquer les filtres';
            });

            function initRegionDropdown() {
                regionSelect.innerHTML = '<option value="">Sélectionnez une région</option>';
                REGIONS.forEach(reg => {
                    const opt = document.createElement('option');
                    opt.value = reg.id;
                    opt.textContent = reg.label;
                    regionSelect.appendChild(opt);
                });
                regionSelect.selectedIndex = 8;
            }

            function getRegionLabel(regionId) {
                const reg = REGIONS.find(r => r.id === regionId);
                return reg ? reg.label : regionId;
            }

            function findMatchingRule(regionId, year) {
                if (regionId === 'manual') return null;

                const exactRule = ARCHIVES_RULES.find(r => 
                    r.regions.includes(regionId) && 
                    r.type === 'exact' && 
                    r.years.includes(year)
                );
                if (exactRule) return exactRule;

                return ARCHIVES_RULES.find(r => 
                    r.regions.includes(regionId) && 
                    r.type === 'period' && 
                    year >= r.start && year <= r.end
                );
            }

            function resetAllOverrides() {
                delete annuaireText.dataset.userModified;
                delete annuaireExtensionInput.dataset.userModified;
                annuaireExtensionInput.value = '';
            }

            function buildIframeTemplate(initialUrl, formattedPage, annuaire, year, annuaireExtension, page, initialErrorMsg = null) {
                return `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                        <style>
                            body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #222; overflow: hidden; font-family: Arial, sans-serif; color: #ff6b6b; text-align: center; user-select: none; touch-action: none; }
                            #viewer-container { width: 100%; height: 100%; overflow: hidden; position: relative; cursor: grab; display: flex; align-items: center; justify-content: center; touch-action: none; }
                            #viewer-container:active { cursor: grabbing; }
                            img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.05s ease-out, filter 0.2s ease; transform-origin: center center; }
                            .zoom-controls { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; z-index: 100; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 6px; }
                            .zoom-controls button { width: 36px; height: 36px; font-size: 16px; font-weight: bold; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
                            .zoom-controls button:hover { background: #555; }
                            .zoom-controls button.active { background: #007BFF; border-color: #0056b3; }
                            .error-box { display: ${initialErrorMsg ? 'block' : 'none'}; padding: 20px; }
                            .error-box h3 { margin: 0 0 10px 0; font-size: 1.1em; }
                            .error-box p { margin: 0; color: #ccc; font-size: 0.9em; }
                            .toast-year { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); color: #fff; font-size: 2rem; font-weight: bold; padding: 15px 30px; border-radius: 10px; z-index: 1000; pointer-events: none; opacity: 0; transition: opacity 0.2s ease-in-out; border: 2px solid #007BFF; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
                            .toast-year.show { opacity: 1; }
                        </style>
                    </head>
                    <body>
                        <div id="viewer-container">
                            <div class="zoom-controls" style="display: ${initialErrorMsg ? 'none' : 'flex'};">
                                <button id="btnFullscreen" title="Plein écran">⛶</button>
                                <button id="btnInvert" title="Négatif / Inverser couleurs">🌓</button>
                                <button id="btnContrast" title="Renforcer le contraste">🔆</button>
                                <button id="btnRotateLeft" title="Rotation 90° gauche">⟲</button>
                                <button id="btnRotateRight" title="Rotation 90° droite">⟳</button>
                                <button id="btnZoomOut" title="Zoom arrière">−</button>
                                <button id="btnZoomIn" title="Zoom avant">+</button>
                                <button id="btnReset" title="Réinitialiser tout">↺</button>
                            </div>
                            <div id="toastYear" class="toast-year"></div>
                            <img id="imgViewer" src="${initialUrl || ''}" alt="Page d'annuaire" style="display: ${initialErrorMsg ? 'none' : 'block'};" onerror="this.style.display='none'; document.querySelector('.zoom-controls').style.display='none'; document.getElementById('err').style.display='block'; if(window.parent && window.parent.handlePageNotFound) { window.parent.handlePageNotFound(currentPageNum); }">
                            <div id="err" class="error-box">
                                <h3>⚠️ Information</h3>
                                <p id="errDetails">${initialErrorMsg || `L'image de la page ${formattedPage} n'existe pas dans les archives PTT pour le code <strong>${annuaire}_${year}${annuaireExtension}</strong>.`}</p>
                            </div>
                        </div>
                        <script>
                            const container = document.getElementById('viewer-container');
                            const img = document.getElementById('imgViewer');
                            const errBox = document.getElementById('err');
                            const errDetails = document.getElementById('errDetails');
                            const zoomControls = document.querySelector('.zoom-controls');
                            const toastYear = document.getElementById('toastYear');
                            let currentPageNum = ${page || 1};
                            let toastTimeout = null;
                            let scale = 1, pX = 0, pY = 0, rotation = 0, isInverted = false, isHighContrast = false, isDragging = false, startX = 0, startY = 0;

                            window.showYearToast = function(yearVal) {
                                toastYear.textContent = '📅 Année : ' + yearVal;
                                toastYear.classList.add('show');
                                if (toastTimeout) clearTimeout(toastTimeout);
                                toastTimeout = setTimeout(() => {
                                    toastYear.classList.remove('show');
                                }, 2000);
                            };

                            window.showCustomError = function(msg) {
                                errDetails.innerHTML = msg;
                                errBox.style.display = 'block';
                                zoomControls.style.display = 'none';
                                img.style.display = 'none';
                            };

                            window.updateImageSource = function(newUrl, newFormattedPage, newAnnuaire, newYear, newExt, pageNum) {
                                currentPageNum = pageNum;
                                errDetails.innerHTML = \`L'image de la page \${newFormattedPage} n'existe pas dans les archives PTT pour le code <strong>\${newAnnuaire}_\${newYear}\${newExt}</strong>.\`;
                                errBox.style.display = 'none';
                                zoomControls.style.display = 'flex';
                                img.style.display = 'block';
                                img.src = newUrl;
                            };

                            function updateTransform() {
                                const filterStr = \`\${isInverted ? 'invert(100%) ' : ''}\${isHighContrast ? 'contrast(170%) brightness(105%) ' : ''}\`;
                                img.style.filter = filterStr;
                                img.style.transform = \`translate(\${pX}px, \${pY}px) scale(\${scale}) rotate(\${rotation}deg)\`;
                            }

                            function setZoom(newScale, targetX, targetY) {
                                newScale = Math.max(0.5, Math.min(newScale, 8));
                                if (targetX !== undefined && targetY !== undefined) {
                                    const ratio = newScale / scale;
                                    pX = targetX - (targetX - pX) * ratio;
                                    pY = targetY - (targetY - pY) * ratio;
                                }
                                scale = newScale;
                                updateTransform();
                            }

                            document.getElementById('btnFullscreen').addEventListener('click', () => {
                                if (!document.fullscreenElement) {
                                    container.requestFullscreen().catch(err => alert(err.message));
                                } else {
                                    document.exitFullscreen();
                                }
                            });

                            const btnInvert = document.getElementById('btnInvert');
                            btnInvert.addEventListener('click', () => {
                                isInverted = !isInverted;
                                btnInvert.classList.toggle('active', isInverted);
                                updateTransform();
                            });

                            const btnContrast = document.getElementById('btnContrast');
                            btnContrast.addEventListener('click', () => {
                                isHighContrast = !isHighContrast;
                                btnContrast.classList.toggle('active', isHighContrast);
                                updateTransform();
                            });

                            document.getElementById('btnRotateLeft').addEventListener('click', () => { rotation = (rotation - 90) % 360; updateTransform(); });
                            document.getElementById('btnRotateRight').addEventListener('click', () => { rotation = (rotation + 90) % 360; updateTransform(); });

                            document.getElementById('btnZoomIn').addEventListener('click', () => setZoom(scale * 1.3));
                            document.getElementById('btnZoomOut').addEventListener('click', () => setZoom(scale / 1.3));
                            document.getElementById('btnReset').addEventListener('click', () => { 
                                scale = 1; pX = 0; pY = 0; rotation = 0; isInverted = false; isHighContrast = false;
                                btnInvert.classList.remove('active');
                                btnContrast.classList.remove('active');
                                updateTransform(); 
                            });

                            container.addEventListener('wheel', (e) => {
                                e.preventDefault();
                                const rect = container.getBoundingClientRect();
                                const mouseX = e.clientX - rect.left - rect.width / 2;
                                const mouseY = e.clientY - rect.top - rect.height / 2;
                                const delta = e.deltaY < 0 ? 1.15 : 1 / 1.15;
                                setZoom(scale * delta, mouseX, mouseY);
                            }, { passive: false });

                            container.addEventListener('mousedown', (e) => {
                                if (e.target.tagName === 'BUTTON') return;
                                isDragging = true;
                                startX = e.clientX - pX;
                                startY = e.clientY - pY;
                            });

                            window.addEventListener('mousemove', (e) => {
                                if (!isDragging) return;
                                pX = e.clientX - startX;
                                pY = e.clientY - startY;
                                updateTransform();
                            });

                            window.addEventListener('mouseup', () => isDragging = false);

                            let initialDist = 0;
                            container.addEventListener('touchstart', (e) => {
                                if (e.target.tagName === 'BUTTON') return;
                                e.preventDefault();
                                if (e.touches.length === 1) {
                                    isDragging = true;
                                    startX = e.touches[0].clientX - pX;
                                    startY = e.touches[0].clientY - pY;
                                } else if (e.touches.length === 2) {
                                    isDragging = false;
                                    initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                                }
                            }, { passive: false });

                            container.addEventListener('touchmove', (e) => {
                                e.preventDefault();
                                if (isDragging && e.touches.length === 1) {
                                    pX = e.touches[0].clientX - startX;
                                    pY = e.touches[0].clientY - startY;
                                    updateTransform();
                                } else if (e.touches.length === 2 && initialDist > 0) {
                                    const rect = container.getBoundingClientRect();
                                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left - rect.width / 2;
                                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top - rect.height / 2;
                                    const currentDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                                    const delta = currentDist / initialDist;
                                    setZoom(scale * delta, midX, midY);
                                    initialDist = currentDist;
                                }
                            }, { passive: false });

                            container.addEventListener('touchend', () => isDragging = false);

                            window.addEventListener('keydown', (e) => {
                                if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                                    e.preventDefault();
                                    if (!window.parent) return;
                                    if (e.key === 'ArrowLeft') window.parent.changePage(-1);
                                    else if (e.key === 'ArrowRight') window.parent.changePage(1);
                                    else if (e.key === 'ArrowUp') window.parent.changeYear(-1);
                                    else if (e.key === 'ArrowDown') window.parent.changeYear(1);
                                }
                            });
                        <\/script>
                    </body>
                    </html>
                `;
            }

            function updateIframe() {
                const yearVal = yearInput.value.trim();
                const year = parseInt(yearVal, 10);

                if (yearVal.length === 4 && year >= 1880 && year <= 1950) {
                    yearError.style.display = 'none';
                } else {
                    if (yearVal.length === 4) yearError.style.display = 'block';
                    return;
                }

                const selectedRegionId = regionSelect.value;
                if (!selectedRegionId) {
                    const errorMsg = "Veuillez sélectionner une région.";
                    urlLink.href = "#";
                    urlLink.textContent = errorMsg;
                    if (iframe.contentWindow && typeof iframe.contentWindow.showCustomError === 'function') {
                        iframe.contentWindow.showCustomError(errorMsg);
                    } else {
                        iframe.srcdoc = buildIframeTemplate('', '0001', '', year, '', 1, errorMsg);
                    }
                    ruleNote.style.display = 'none';
                    editionGroup.style.display = 'none';
                    return;
                }

                let rule = null;
                if (selectedRegionId === 'manual') {
                    ruleNote.textContent = "⚙️ Mode Manuel : saisie libre du code et de l'extension d'annuaire.";
                    ruleNote.className = "info-badge";
                    ruleNote.style.display = 'block';
                    editionGroup.style.display = 'none';
                } else {
                    rule = findMatchingRule(selectedRegionId, year);

                    if (rule) {
                        if (!annuaireText.dataset.userModified) {
                            annuaireText.value = rule.baseCode;
                        }

                        ruleNote.className = "info-badge";
                        if (rule.note) {
                            ruleNote.textContent = "ℹ️ " + rule.note;
                            ruleNote.style.display = 'block';
                        } else {
                            ruleNote.style.display = 'none';
                        }

                        if (rule.editions && rule.editions.length > 0) {
                            editionGroup.style.display = 'flex';
                            const currentEd = editionSelect.value;
                            editionSelect.innerHTML = '';
                            rule.editions.forEach(ed => {
                                const opt = document.createElement('option');
                                opt.value = ed.value;
                                opt.textContent = ed.label;
                                if (ed.value === currentEd) opt.selected = true;
                                editionSelect.appendChild(opt);
                            });
                            
                            if (!annuaireExtensionInput.dataset.userModified) {
                                annuaireExtensionInput.value = editionSelect.value;
                            }
                        } else {
                            editionGroup.style.display = 'none';
                            if (!annuaireExtensionInput.dataset.userModified) {
                                annuaireExtensionInput.value = '';
                            }
                        }
                    } else {
                        ruleNote.textContent = `⚠️ Aucun annuaire connu pour ${getRegionLabel(selectedRegionId)} en ${year}.`;
                        ruleNote.className = "info-badge warning";
                        ruleNote.style.display = 'block';
                        editionGroup.style.display = 'none';

                        if (!annuaireText.dataset.userModified) annuaireText.value = '';
                        if (!annuaireExtensionInput.dataset.userModified) annuaireExtensionInput.value = '';
                    }
                }

                const annuaire = annuaireText.value.trim();
                if (!annuaire) {
                    const noAnnuaireMsg = `⚠️ Aucun annuaire répertorié pour <strong>${getRegionLabel(selectedRegionId)}</strong> en <strong>${year}</strong>.`;
                    urlLink.href = "#";
                    urlLink.textContent = `Aucun code d'annuaire répertorié pour ${getRegionLabel(selectedRegionId)} en ${year}.`;
                    
                    if (iframe.contentWindow && typeof iframe.contentWindow.showCustomError === 'function') {
                        iframe.contentWindow.showCustomError(noAnnuaireMsg);
                    } else {
                        iframe.srcdoc = buildIframeTemplate('', '0001', '', year, '', 1, noAnnuaireMsg);
                    }
                    return;
                }

                const annuaireExtension = annuaireExtensionInput.value.trim();
                const currentDocKey = `${annuaire}_${year}${annuaireExtension}`;

                let baseMax = (rule && rule.maxPages) ? rule.maxPages : (year <= 1910 ? 600 : 1700);

                if (currentDocKey !== currentAnnuaireKey) {
                    currentAnnuaireKey = currentDocKey;
                    currentAnnuaireMax = baseMax;
                }

                let page = parseInt(pageInput.value, 10) || 1;
                if (page < 1 || page > 9999) {
                    pageError.style.display = 'block';
                } else {
                    pageError.style.display = 'none';
                }

                if (page > currentAnnuaireMax) {
                    currentAnnuaireMax = page;
                }

                pageSlider.max = currentAnnuaireMax;
                sliderMaxLabel.textContent = currentAnnuaireMax;
                pageSlider.value = page;

                const formattedPage = page.toString().padStart(4, '0');

                const encodedAnnuaire = encodeURIComponent(annuaire);
                const encodedYear = encodeURIComponent(year);
                const encodedExt = encodeURIComponent(annuaireExtension);
                const url = `https://iiif.ptt-archiv.ch/iiif/3/${encodedAnnuaire}_${encodedYear}${encodedExt}_${formattedPage}.jp2/full/max/0/default.jpg`;

                urlLink.href = url;
                urlLink.textContent = url;

                if (iframe.contentWindow && typeof iframe.contentWindow.updateImageSource === 'function') {
                    iframe.contentWindow.updateImageSource(url, formattedPage, annuaire, year, annuaireExtension, page);
                } else {
                    iframe.srcdoc = buildIframeTemplate(url, formattedPage, annuaire, year, annuaireExtension, page);
