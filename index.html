<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTT Archives Helper</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .left-panel {
            flex-basis: 340px;
            flex-shrink: 0;
            padding: 20px;
            background-color: #f4f4f4;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-y: auto;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Conteneur principal centré verticalement sur bureau */
        .left-panel-content {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
        }

        /* Bouton de repliement sur mobile */
        .mobile-toggle-btn {
            display: none;
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .right-panel {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            align-items: center;
            justify-content: center;
            background-color: #eaeaea;
        }

        .right-panel iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: center;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        /* Espacement accru avant le groupe Annuaire sur PC */
        .form-group-annuaire {
            margin-top: 35px;
        }

        /* Style compact inline pour libellés à gauche */
        .form-group-inline {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .form-group-inline label {
            margin-bottom: 0;
            white-space: nowrap;
            font-weight: bold;
        }

        .form-group-inline input,
        .form-group-inline select {
            flex: 1;
            min-width: 0;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }

        .form-group-inline .error-message {
            width: 100%;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .button-group button,
        .external-link button {
            padding: 8px 12px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
        }

        .button-group button:hover,
        .external-link button:hover {
            background-color: #0056b3;
            transform: scale(1.03);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .info-badge {
            background-color: #e7f3fe;
            border-left: 4px solid #2196F3;
            padding: 10px;
            font-size: 0.85em;
            color: #0c5460;
            margin-bottom: 15px;
            border-radius: 2px;
            display: none;
            text-align: center;
        }

        .info-badge.warning {
            background-color: #fff3cd;
            border-left-color: #ffc107;
            color: #856404;
        }

        .external-link {
            padding-top: 15px;
            text-align: center;
        }

        .external-link button {
            width: 100%;
            padding: 10px;
        }

        .url-display {
            width: 100%;
            padding: 10px;
            background-color: #ffffff;
            font-family: monospace;
            word-break: break-all;
            text-align: center;
            border-bottom: 1px solid #ccc;
        }

        .error-message {
            color: #d9534f;
            font-size: 0.85em;
            display: none;
            margin-top: 4px;
            text-align: center;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            .left-panel {
                flex-basis: auto;
                width: 100%;
                max-height: 50vh;
                padding: 12px;
                box-shadow: none;
                border-bottom: 2px solid #ccc;
            }
            .left-panel-content {
                margin: 0;
            }
            .form-group-annuaire {
                margin-top: 10px;
            }
            .mobile-toggle-btn {
                display: block;
            }
            /* Masquage des éléments quand le panneau est replié */
            .left-panel.collapsed {
                max-height: none;
                padding: 8px 12px;
            }
            .left-panel.collapsed .left-panel-content,
            .left-panel.collapsed .external-link {
                display: none;
            }
            .left-panel.collapsed .mobile-toggle-btn {
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <button id="mobileToggleBtn" class="mobile-toggle-btn">⚙️ Masquer les filtres</button>

            <div class="left-panel-content">
                <!-- a) Sélection de la Région / Canton -->
                <div class="form-group-inline">
                    <label for="regionSelect">Région :</label>
                    <select id="regionSelect">
                        <option value="">Sélectionnez une région</option>
                    </select>
                </div>

                <!-- b) Sélection de l'année -->
                <div class="form-group-inline">
                    <label for="year">Année :</label>
                    <input type="number" id="year" value="1920" min="1880" max="1950">
                    <small id="yearError" class="error-message">L'année doit être comprise entre 1880 et 1950.</small>
                </div>

                <div class="button-group">
                    <button id="btnYearDec10">- 10</button>
                    <button id="btnYearDec1">- 1</button>
                    <button id="btnYearInc1">+ 1</button>
                    <button id="btnYearInc10">+ 10</button>
                </div>

                <!-- c) Sélecteur d'édition dynamique -->
                <div class="form-group-inline" id="editionGroup" style="display: none;">
                    <label for="editionSelect">Édition :</label>
                    <select id="editionSelect"></select>
                </div>

                <!-- d) Champ d'information (Badge explicatif) -->
                <div id="ruleNote" class="info-badge"></div>

                <!-- e) Sélection de la page -->
                <div class="form-group-inline">
                    <label for="page">Page :</label>
                    <input type="number" id="page" value="1" min="1" max="9999">
                    <small id="pageError" class="error-message">La page doit être comprise entre 1 et 9999.</small>
                </div>

                <div class="button-group">
                    <button id="btnPageDec100">-100</button>
                    <button id="btnPageDec10">-10</button>
                    <button id="btnPageDec1">-1</button>
                    <button id="btnPageInc1">+1</button>
                    <button id="btnPageInc10">+10</button>
                    <button id="btnPageInc100">+100</button>
                </div>

                <!-- f) Bouton Actualiser -->
                <div class="button-group">
                    <button id="btnRefresh" style="width: 100%; background-color: #28a745;">Actualiser</button>
                </div>

                <!-- g) Groupe d'annuaire (Code et Extension) -->
                <div class="form-group form-group-annuaire">
                    <label for="annuaireText">Annuaire :</label>
                    <input type="text" id="annuaireText" placeholder="Code d'annuaire (auto ou manuel)">
                    <input type="text" id="annuaireExtension" placeholder="Extension optionnelle (ex: _a)" style="margin-top: 6px;">
                </div>
            </div>

            <div class="external-link">
                <button id="btnHistoricSearch">Ouvrir Historic Search</button>
            </div>
        </div>

        <div class="right-panel">
            <div id="urlDisplay" class="url-display">
                <a id="urlLink" href="#" target="_blank" rel="noopener noreferrer">L'URL s'affichera ici</a>
            </div>
            <iframe id="resultFrame" title="Aperçu du document IIIF" src="about:blank"></iframe>
        </div>
    </div>

    <script>
        // =========================================================================
        // 1. LOGIQUE D'INTERFACE
        // =========================================================================

        document.addEventListener('DOMContentLoaded', () => {
            const yearInput = document.getElementById('year');
            const yearError = document.getElementById('yearError');
            const regionSelect = document.getElementById('regionSelect');
            const editionGroup = document.getElementById('editionGroup');
            const editionSelect = document.getElementById('editionSelect');
            const annuaireText = document.getElementById('annuaireText');
            const annuaireExtensionInput = document.getElementById('annuaireExtension');
            const ruleNote = document.getElementById('ruleNote');
            const pageInput = document.getElementById('page');
            const pageError = document.getElementById('pageError');
            const iframe = document.getElementById('resultFrame');
            const urlLink = document.getElementById('urlLink');
            const mobileToggleBtn = document.getElementById('mobileToggleBtn');
            const leftPanel = document.querySelector('.left-panel');

            // Gestion du repliement sur mobile
            mobileToggleBtn.addEventListener('click', () => {
                leftPanel.classList.toggle('collapsed');
                if (leftPanel.classList.contains('collapsed')) {
                    mobileToggleBtn.textContent = '⚙️ Afficher les filtres';
                } else {
                    mobileToggleBtn.textContent = '⚙️ Masquer les filtres';
                }
            });

            function initRegionDropdown() {
                regionSelect.innerHTML = '<option value="">Sélectionnez une région</option>';
                REGIONS.forEach(reg => {
                    const opt = document.createElement('option');
                    opt.value = reg.id;
                    opt.textContent = reg.label;
                    regionSelect.appendChild(opt);
                });
                regionSelect.selectedIndex = 8;
            }

            function getRegionLabel(regionId) {
                const reg = REGIONS.find(r => r.id === regionId);
                return reg ? reg.label : regionId;
            }

            function findMatchingRule(regionId, year) {
                if (regionId === 'manual') return null;

                const exactRule = ARCHIVES_RULES.find(r => 
                    r.regions.includes(regionId) && 
                    r.type === 'exact' && 
                    r.years.includes(year)
                );
                if (exactRule) return exactRule;

                return ARCHIVES_RULES.find(r => 
                    r.regions.includes(regionId) && 
                    r.type === 'period' && 
                    year >= r.start && year <= r.end
                );
            }

            function resetAllOverrides() {
                delete annuaireText.dataset.userModified;
                delete annuaireExtensionInput.dataset.userModified;
                annuaireExtensionInput.value = '';
            }

            function updateIframe() {
                const yearVal = yearInput.value.trim();
                const year = parseInt(yearVal, 10);

                if (yearVal.length === 4 && year >= 1880 && year <= 1950) {
                    yearError.style.display = 'none';
                } else {
                    if (yearVal.length === 4) {
                        yearError.style.display = 'block';
                    }
                    return;
                }

                const selectedRegionId = regionSelect.value;
                if (!selectedRegionId) {
                    urlLink.href = "#";
                    urlLink.textContent = "Veuillez sélectionner une région.";
                    iframe.srcdoc = "";
                    ruleNote.style.display = 'none';
                    editionGroup.style.display = 'none';
                    return;
                }

                if (selectedRegionId === 'manual') {
                    ruleNote.textContent = "⚙️ Mode Manuel : saisie libre du code et de l'extension d'annuaire.";
                    ruleNote.className = "info-badge";
                    ruleNote.style.display = 'block';
                    editionGroup.style.display = 'none';
                } else {
                    const rule = findMatchingRule(selectedRegionId, year);

                    if (rule) {
                        if (!annuaireText.dataset.userModified) {
                            annuaireText.value = rule.baseCode;
                        }

                        ruleNote.className = "info-badge";
                        if (rule.note) {
                            ruleNote.textContent = "ℹ️ " + rule.note;
                            ruleNote.style.display = 'block';
                        } else {
                            ruleNote.style.display = 'none';
                        }

                        if (rule.editions && rule.editions.length > 0) {
                            editionGroup.style.display = 'flex';
                            const currentEd = editionSelect.value;
                            editionSelect.innerHTML = '';
                            rule.editions.forEach(ed => {
                                const opt = document.createElement('option');
                                opt.value = ed.value;
                                opt.textContent = ed.label;
                                if (ed.value === currentEd) opt.selected = true;
                                editionSelect.appendChild(opt);
                            });
                            
                            if (!annuaireExtensionInput.dataset.userModified) {
                                annuaireExtensionInput.value = editionSelect.value;
                            }
                        } else {
                            editionGroup.style.display = 'none';
                            if (!annuaireExtensionInput.dataset.userModified) {
                                annuaireExtensionInput.value = '';
                            }
                        }
                    } else {
                        ruleNote.textContent = `⚠️ Aucun annuaire connu pour ${getRegionLabel(selectedRegionId)} en ${year}.`;
                        ruleNote.className = "info-badge warning";
                        ruleNote.style.display = 'block';
                        editionGroup.style.display = 'none';

                        if (!annuaireText.dataset.userModified) {
                            annuaireText.value = '';
                        }
                        if (!annuaireExtensionInput.dataset.userModified) {
                            annuaireExtensionInput.value = '';
                        }
                    }
                }

                const annuaire = annuaireText.value.trim();
                if (!annuaire) {
                    urlLink.href = "#";
                    urlLink.textContent = `Aucun code d'annuaire répertorié pour ${getRegionLabel(selectedRegionId)} en ${year}.`;
                    iframe.srcdoc = "";
                    return;
                }

                let page = parseInt(pageInput.value, 10) || 1;
                if (page < 1 || page > 9999) {
                    pageError.style.display = 'block';
                } else {
                    pageError.style.display = 'none';
                }

                const formattedPage = page.toString().padStart(4, '0');
                const annuaireExtension = annuaireExtensionInput.value.trim();

                const encodedAnnuaire = encodeURIComponent(annuaire);
                const encodedYear = encodeURIComponent(year);
                const encodedExt = encodeURIComponent(annuaireExtension);
                const url = `https://iiif.ptt-archiv.ch/iiif/3/${encodedAnnuaire}_${encodedYear}${encodedExt}_${formattedPage}.jp2/full/max/0/default.jpg`;

                urlLink.href = url;
                urlLink.textContent = url;

                iframe.srcdoc = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #222; overflow: hidden; font-family: Arial, sans-serif; color: #ff6b6b; text-align: center; }
                            img { max-width: 100%; max-height: 100%; object-fit: contain; }
                            .error-box { display: none; padding: 20px; }
                            .error-box h3 { margin: 0 0 10px 0; font-size: 1.1em; }
                            .error-box p { margin: 0; color: #ccc; font-size: 0.9em; }
                        </style>
                    </head>
                    <body>
                        <img src="${url}" alt="Page d'annuaire" onerror="this.style.display='none'; document.getElementById('err').style.display='block';">
                        <div id="err" class="error-box">
                            <h3>⚠️ Page introuvable (Erreur 404)</h3>
                            <p>L'image de la page ${formattedPage} n'existe pas dans les archives PTT pour le code <strong>${annuaire}_${year}${annuaireExtension}</strong>.</p>
                        </div>
                    </body>
                    </html>
                `;
            }

            function changeYear(delta) {
                let currentYear = parseInt(yearInput.value, 10) || 1920;
                yearInput.value = Math.min(Math.max(currentYear + delta, 1880), 1950);
                updateIframe();
            }

            function changePage(delta) {
                let currentPage = parseInt(pageInput.value, 10) || 1;
                pageInput.value = Math.min(Math.max(currentPage + delta, 1), 9999);
                updateIframe();
            }

            // Événements
            regionSelect.addEventListener('change', () => {
                resetAllOverrides();
                updateIframe();
            });

            editionSelect.addEventListener('change', () => {
                annuaireExtensionInput.value = editionSelect.value;
                delete annuaireExtensionInput.dataset.userModified;
                updateIframe();
            });

            annuaireText.addEventListener('input', () => {
                annuaireText.dataset.userModified = "true";
                if (regionSelect.value !== 'manual') {
                    regionSelect.value = 'manual';
                }
                annuaireExtensionInput.value = '';
                delete annuaireExtensionInput.dataset.userModified;
                updateIframe();
            });

            annuaireExtensionInput.addEventListener('input', () => {
                annuaireExtensionInput.dataset.userModified = "true";
                if (regionSelect.value !== 'manual') {
                    regionSelect.value = 'manual';
                }
                updateIframe();
            });

            yearInput.addEventListener('input', updateIframe);
            pageInput.addEventListener('input', updateIframe);

            document.getElementById('btnRefresh').addEventListener('click', updateIframe);

            // Boutons d'année (-10, -1, +1, +10)
            document.getElementById('btnYearDec10').addEventListener('click', () => changeYear(-10));
            document.getElementById('btnYearDec1').addEventListener('click', () => changeYear(-1));
            document.getElementById('btnYearInc1').addEventListener('click', () => changeYear(1));
            document.getElementById('btnYearInc10').addEventListener('click', () => changeYear(10));

            // Boutons de page
            document.getElementById('btnPageDec100').addEventListener('click', () => changePage(-100));
            document.getElementById('btnPageDec10').addEventListener('click', () => changePage(-10));
            document.getElementById('btnPageDec1').addEventListener('click', () => changePage(-1));
            document.getElementById('btnPageInc1').addEventListener('click', () => changePage(1));
            document.getElementById('btnPageInc10').addEventListener('click', () => changePage(10));
            document.getElementById('btnPageInc100').addEventListener('click', () => changePage(100));

            document.getElementById('btnHistoricSearch').addEventListener('click', () => {
                window.open('https://historic.localsearch.ch/fr/search', '_blank');
            });

            // Navigation au clavier
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
                    return;
                }
                if (e.key === 'ArrowLeft') {
                    changePage(-1);
                } else if (e.key === 'ArrowRight') {
                    changePage(1);
                }
            });

            // Initialisation
            initRegionDropdown();
            updateIframe();
        });

        // =========================================================================
        // 2. STRUCTURE DE DONNÉES ET RÈGLES D'ARCHIVES
        // =========================================================================
        
        const REGIONS = [
            { id: "zh_stadt", label: "Zurich (Ville / Stadt)" },
            { id: "zh_land",  label: "Zurich (Canton / Land)" },
            { id: "GE",       label: "Genève (GE)" },
            { id: "VD",       label: "Vaud (VD)" },
            { id: "VS",       label: "Valais (VS)" },
            { id: "FR",       label: "Fribourg (FR)" },
            { id: "NE",       label: "Neuchâtel (NE)" },
            { id: "SO",       label: "Soleure (SO)" },
            { id: "BE_stadt", label: "Berne (Ville)" },
            { id: "BE_land",  label: "Berne (Canton)" },
            { id: "TG",       label: "Thurgovie (TG)" },
            { id: "manual",   label: "⚙️ Mode Manuel / Saisie libre" }
        ];

        const ARCHIVES_RULES = [
            // --- Zurich (Ville & Canton) ---
            {
                regions: ["zh_stadt", "zh_land"],
                type: "exact",
                years: [1888],
                baseCode: "P-260-1_Glarus",
                note: "Édition spéciale 1888 regroupée sous l'annuaire Glaris"
            },
            {
                regions: ["zh_stadt", "zh_land"],
                type: "exact",
                years: [1884, 1887, 1898, 1899, 1900, 1904],
                baseCode: "P-260-1_Zuerich",
                editions: [
                    { value: "_1", label: "Édition 1" },
                    { value: "_2", label: "Édition 2" }
                ],
                note: "Année avec 2 éditions publiées"
            },

            // --- Romandie (GE, VD, VS, FR) ---
            {
                regions: ["VD"],
                type: "exact",
                years: [1883],
                baseCode: "P-260-1_Lausann",
                note: "Vaud (1883)"
            },
            {
                regions: ["GE"],
                type: "exact",
                years: [1884],
                baseCode: "P-260-1_Geneve",
                note: "Genève (1884)"
            },
            {
                regions: ["GE", "VD"],
                type: "exact",
                years: [1885],
                baseCode: "P-260-1_Geneve_Lausanne",
                editions: [
                    { value: "_1", label: "Édition 1" },
                    { value: "_2", label: "Édition 2" }
                ],
                note: "Genève - Vaud (1885) (2 éditions)"
            },
            {
                regions: ["GE"],
                type: "exact",
                years: [1891],
                baseCode: "P-260-1_Geneve_Lausanne",
                note: "Genève (1891)"
            },
            {
                regions: ["GE", "VD"],
                type: "exact",
                years: [1895],
                baseCode: "P-260-1_Geneve_Lausanne",
                editions: [
                    { value: "_1", label: "Édition 1" },
                    { value: "_2", label: "Édition 2" }
                ],
                note: "Genève - Vaud (1895) (2 éditions)"
            },
            {
                regions: ["GE", "VD"],
                type: "period",
                start: 1888,
                end: 1894,
                baseCode: "P-260-1_Geneve_Lausanne",
                note: "Genève - Vaud (1888-1894)"
            },
            {
                regions: ["GE", "VD", "VS"],
                type: "exact",
                years: [1902, 1903, 1909],
                baseCode: "P-260-1_Genève",
                note: "Genève - Vaud- Valais (Genève avec accent)"
            },
            {
                regions: ["GE", "VD", "VS"],
                type: "period",
                start: 1897,
                end: 1910,
                baseCode: "P-260-1_Geneve",
                note: "Genève - Vaud- Valais (1897-1910)"
            },
            {
                regions: ["GE", "VD", "VS", "FR", "NE"],
                type: "period",
                start: 1911,
                end: 1950,
                baseCode: "P-260-1_1",
                note: "Suisse romande (1911-1950)"
            },

            // --- Zurich & Thurgovie ---
            {
                regions: ["zh_stadt", "zh_land"],
                type: "period",
                start: 1880,
                end: 1910,
                baseCode: "P-260-1_Zuerich",
                note: "Zurich (1880-1910)"
            },
            {
                regions: ["TG"],
                type: "period",
                start: 1880,
                end: 1910,
                baseCode: "P-260-1_St_Gallen",
                note: "Thurgovie incluse dans l'annuaire St-Gall / Appenzell / Thurgovie"
            },
            {
                regions: ["zh_stadt", "zh_land", "TG"],
                type: "period",
                start: 1911,
                end: 1946,
                baseCode: "P-260-1_3",
                note: "Zurich & Suisse orientale (1911-1946)"
            },
            {
                regions: ["zh_stadt"],
                type: "period",
                start: 1947,
                end: 1950,
                baseCode: "P-260-1_3a",
                note: "Zurich Ville (dès 1947)"
            },
            {
                regions: ["zh_land", "TG"],
                type: "period",
                start: 1947,
                end: 1950,
                baseCode: "P-260-1_3b",
                note: "Zurich Canton & Thurgovie (dès 1947)"
            },

            // --- Berne & Soleure ---
            {
                regions: ["SO"],
                type: "exact",
                years: [1882],
                baseCode: "P-260-1_Bern",
                editions: [
                    { value: "_2", label: "Édition 2" }
                ],
                note: "Berne, Soleure (1882)"
            },
            {
                regions: ["SO"],
                type: "exact",
                years: [1884, 1887],
                baseCode: "P-260-1_Solothurn",
                note: "Soleure (1884)"
            },
            {
                regions: ["BE_stadt", "BE_land"],
